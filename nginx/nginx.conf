# Reverse proxy: serves the built React app as static files, proxies the
# Django API and the (obfuscated) admin panel to the backend, and serves
# static/media directly from the shared volumes.
#
# ${ADMIN_URL} is substituted at container startup by the official nginx
# image's docker-entrypoint templating (envsubst), using the ADMIN_URL
# environment variable - it must match the backend's ADMIN_URL exactly.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Let's Encrypt HTTP-01 challenge path - needed for both the initial
    # certificate request and every renewal. See README "Free SSL
    # certificate" section.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /${ADMIN_URL} {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # The SPA's own index.html/JS/CSS are served directly by nginx and
        # never pass through Django, so django-csp's middleware (which sets
        # this same header, mirrored here) never runs for them - without
        # this, the page that loads Turnstile/reCAPTCHA had no CSP at all.
        # Scoped to this location only so proxied /api/ and admin responses
        # keep using Django's own CSP header rather than getting a second,
        # redundant one.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com https://www.google.com; frame-src https://challenges.cloudflare.com https://www.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }
}
